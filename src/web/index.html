<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
         anything but zero; the bottom tab bar and the sheets rely on it to
         clear the home indicator on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17171f" />
    <meta name="description" content="Lên kế hoạch chuyến đi cùng nhau: wishlist, lịch trình, chi tiêu." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>WeGo — lên kế hoạch chuyến đi</title>

    <!--
      The first paint, before any JavaScript.

      On a 400 kbps connection the bundle takes about 20 seconds to arrive and
      execute, and until it does an empty <div id="root"> is a blank white
      screen — the app's actual first impression on Vietnamese mobile data.
      This markup and its styles are inline, so they cost no request and are
      painted from the first packets of the document. React replaces the whole
      of #root on mount, which removes it.

      Keep this in step with the tokens in styles/tokens.css by hand: it cannot
      import them, because importing anything is the thing it exists to avoid.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #f7f7fb;
        color: #55556a;
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        font-size: 0.9375rem;
      }
      .boot-mark {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #1a1a24;
      }
      .boot-mark span {
        color: #6d3aed;
      }
      .boot-ring {
        width: 2rem;
        height: 2rem;
        border: 2.5px solid rgba(109, 58, 237, 0.2);
        border-top-color: #6d3aed;
        border-radius: 50%;
        animation: boot-spin 900ms linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Motion is the whole signal, so it slows to a step rather than stopping. */
      @media (prefers-reduced-motion: reduce) {
        .boot-ring {
          animation-duration: 3s;
          animation-timing-function: steps(8, end);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <p class="boot-mark">We<span>Go</span></p>
        <div class="boot-ring" role="status" aria-label="Đang tải"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
